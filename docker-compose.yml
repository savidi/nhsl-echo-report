version: '3.8'

services:
  frontend:
    build: ./echo-dashboard
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: always

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      # This maps the 'reports' folder inside Docker to the 'reports' folder on Windows
      - ./reports:/app/reports
    restart: always